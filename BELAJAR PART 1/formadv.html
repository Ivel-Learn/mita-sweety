<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <form>
        <table border="0" cellspacing="0" cellpadding="10">
            <tr>
                <td><label for="Username">User Name</label></td>
                <td>:</td>
                <td colspan="4"><input type="text" id="Username" maxlength="8" minlength="4"></td>
            </tr>
            <tr>
                <td><label for="Password">Password</label></td>
                <td>:</td>
                <td colspan="4"><input type="password" id="Password" maxlength="8" minlength="4"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>:</td>
                <td colspan="2">
                    <input type="radio" id="Laki-Laki" name="Gender">
                    <label for="Laki-Laki">Laki-Laki</label>
                </td>
                <td colspan="2">
                    <input type="radio" id="Perempuan" name="Gender">
                    <label for="Perempuan">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td>Hobby</td>
                <td>:</td>
                <td><input type="checkbox" id="Futsal">
                    <label for="Futsal">Futsal</label>
                </td>
                <td><input type="checkbox" id="Minisoccer">
                    <label for="Minisoccer">MiniSoccer</label>
                </td>
                <td>
                    <input type="checkbox" id="Menyanyi">
                    <label for="Menyanyi">Menyanyi</label>
                </td>

            </tr>
            <tr>
                <td><label for="Domisili">Domisili</label></td>
                <td>:</td>
                <td colspan="4">
                    <select id="Domisili">
                        <option>Buteng</option>
                        <option>Kendari</option>
                        <option>Koltim</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td colspan="4">
                    <textarea cols="40" rows="10"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="6" align="right">
                    <button type="submit">Kirim</button>
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
