<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form>
        <label for="Username">User Name :</label>
        <input type="text" id="Username">
        <br>
        <label for="Password">Password :</label>
        <input type="password" id="Password">
        <br>
        <input type="radio" id="Laki-Laki" name="Gender">
        <label for="Laki-Laki">Laki-Laki</label>
        <input type="radio" id="Perempuan" name="Gender">
        <label for="Perempuan">Perempuan</label>
        <br>
        <input type="checkbox" id="Futsal">
        <label for="Futsal">Futsal</label>
        <input type="checkbox" id="Minisoccer">
        <label for="Minisoccer">MiniSoccer</label>
        <input type="checkbox" id="Menyanyi">
        <label for="Menyanyi">Menyanyi</label>
        <br>
        <label for="Domisili">Domisili :</label>
        <select id="Domisili">
            <option>Buteng</option>
            <option>Kendari</option>
            <option>Koltim</option>
        </select>
        <br>
        <textarea></textarea>
        <br>
        <button type="submit">Kirim</button>

    </form>
</body>
</html>
